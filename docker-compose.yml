version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/config:/app/backend/config
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/serp_tracker.db
      - SCREENSHOT_DIR=./data/screenshots

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
